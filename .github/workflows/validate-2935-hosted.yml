      - name: Focused tests
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name focused --cwd "$GITHUB_WORKSPACE/upstream/v3/@claude-flow/cli" --timeout-s 420 --evidence "$RUNNER_TEMP/ruflo2935/focused" --allow-nonzero -- pnpm exec vitest run __tests__/services/worker-daemon-darwin-gate-2935.test.ts __tests__/services/available-memory-2935.test.ts __tests__/services/worker-daemon-resource-thresholds.test.ts __tests__/daemon-config-restore-staleness-2935.test.ts __tests__/config-set-daemon.test.ts __tests__/daemon-start-flag-keys.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/ruflo2935/focused/vitest-report.json"
      - name: Darwin probe
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name probe --cwd "$GITHUB_WORKSPACE" --timeout-s 30 --evidence "$RUNNER_TEMP/ruflo2935/probe" -- node packet/validation/ruflo2935/probe.mjs "$RUNNER_TEMP/ruflo2935/probe"
      - name: Built candidate probe
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name candidate-probe --cwd "$GITHUB_WORKSPACE" --timeout-s 30 --evidence "$RUNNER_TEMP/ruflo2935/candidate-probe" -- node packet/validation/ruflo2935/candidate_probe.mjs upstream/v3/@claude-flow/cli/dist/src/services/available-memory.js "$RUNNER_TEMP/ruflo2935/candidate-probe"

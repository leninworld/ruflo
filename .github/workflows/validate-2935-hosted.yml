      - name: Install
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name install --cwd "$GITHUB_WORKSPACE/upstream/v3" --timeout-s 720 --evidence "$RUNNER_TEMP/ruflo2935/install" -- pnpm install --frozen-lockfile
      - name: Build
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name build --cwd "$GITHUB_WORKSPACE/upstream/v3" --timeout-s 720 --evidence "$RUNNER_TEMP/ruflo2935/build" --allow-nonzero -- pnpm build
      - name: Typecheck
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name typecheck --cwd "$GITHUB_WORKSPACE/upstream/v3" --timeout-s 720 --evidence "$RUNNER_TEMP/ruflo2935/typecheck" --allow-nonzero -- pnpm typecheck
      - name: Candidate pack dry run
        if: matrix.side == 'cand'
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name pack --cwd "$GITHUB_WORKSPACE/upstream/v3/@claude-flow/cli" --timeout-s 180 --evidence "$RUNNER_TEMP/ruflo2935/pack" -- npm pack --dry-run --json --ignore-scripts
      - name: Summarize all evidence
        if: always()
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" summarize --evidence "$RUNNER_TEMP/ruflo2935" --job "node20-build-typecheck-${{ matrix.side }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruflo2935-hosted-node20-build-typecheck-${{ matrix.side }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ruflo2935
          if-no-files-found: error
          retention-days: 7


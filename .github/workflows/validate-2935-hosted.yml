        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" verify-source --side cand --repo "$GITHUB_WORKSPACE/upstream" --patch "$GITHUB_WORKSPACE/packet/validation/ruflo2935/candidate-90ebe2ad.patch" --evidence "$RUNNER_TEMP/ruflo2935/source"

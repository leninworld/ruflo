  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve LF before checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: packet, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: ruvnet/ruflo, ref: '${{ env.UPSTREAM_PIN }}', path: upstream, fetch-depth: 1, persist-credentials: false}

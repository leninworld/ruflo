name: Ruflo 2935 hosted validation

on:
  push:
    branches: [validate-issue-2935-hosted-full]

permissions:
  contents: read

concurrency:
  group: ruflo2935-hosted
  cancel-in-progress: false

env:
  UPSTREAM_PIN: 87f612cef121b50c2e31e2d3f88e46d88963a377
  CANDIDATE_TREE: bed85d39e668d3d919b23fd948e5276c77feaba9

jobs:
  linux-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        side: [base, cand]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: packet, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: ruvnet/ruflo, ref: '${{ env.UPSTREAM_PIN }}', path: upstream, fetch-depth: 1, persist-credentials: false}
      - id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with: {version: '8'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22'}
      - name: Verify pinned source
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" verify-source --side "${{ matrix.side }}" --repo "$GITHUB_WORKSPACE/upstream" --patch "$GITHUB_WORKSPACE/packet/validation/ruflo2935/candidate-90ebe2ad.patch" --evidence "$RUNNER_TEMP/ruflo2935/source"
      - name: Install
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name install --cwd "$GITHUB_WORKSPACE/upstream/v3" --timeout-s 720 --evidence "$RUNNER_TEMP/ruflo2935/install" -- pnpm install --frozen-lockfile
      - name: MCP policy
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name mcp-policy --cwd "$GITHUB_WORKSPACE/upstream/v3/@claude-flow/cli" --timeout-s 180 --evidence "$RUNNER_TEMP/ruflo2935/mcp-policy" -- node scripts/test-mcp-policy-stdio.mjs
      - name: Build, recorded like upstream CI
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name build --cwd "$GITHUB_WORKSPACE/upstream/v3" --timeout-s 720 --evidence "$RUNNER_TEMP/ruflo2935/build" --allow-nonzero -- pnpm --recursive --no-bail run build
      - name: Flywheel smoke
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name flywheel --cwd "$GITHUB_WORKSPACE/upstream/v3/@claude-flow/cli" --timeout-s 180 --evidence "$RUNNER_TEMP/ruflo2935/flywheel" -- node scripts/smoke-flywheel-proof.mjs
      - name: Replay generation
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name replay --cwd "$GITHUB_WORKSPACE/upstream/v3/@claude-flow/cli" --timeout-s 180 --evidence "$RUNNER_TEMP/ruflo2935/replay" -- node scripts/replay-generation.mjs
      - name: Harness smoke
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name smoke --cwd "$GITHUB_WORKSPACE/upstream/v3" --timeout-s 180 --evidence "$RUNNER_TEMP/ruflo2935/smoke" -- @vitest "$GITHUB_WORKSPACE/packet/validation/ruflo2935/guard.sh" @claude-flow/cli/__tests__/config-set-daemon.test.ts
      - name: Require parseable smoke
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" summarize --evidence "$RUNNER_TEMP/ruflo2935" --job "linux-full-${{ matrix.side }}" --require-smoke
      - name: Counted full suite
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name counted --cwd "$GITHUB_WORKSPACE/upstream/v3" --timeout-s 1500 --evidence "$RUNNER_TEMP/ruflo2935/counted" --allow-nonzero -- @vitest "$GITHUB_WORKSPACE/packet/validation/ruflo2935/guard.sh"
      - name: Candidate focused suite
        if: matrix.side == 'cand'
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" run-phase --name focused --cwd "$GITHUB_WORKSPACE/upstream/v3/@claude-flow/cli" --timeout-s 420 --evidence "$RUNNER_TEMP/ruflo2935/focused" --allow-nonzero -- pnpm exec vitest run __tests__/services/worker-daemon-darwin-gate-2935.test.ts __tests__/services/available-memory-2935.test.ts __tests__/services/worker-daemon-resource-thresholds.test.ts __tests__/daemon-config-restore-staleness-2935.test.ts __tests__/config-set-daemon.test.ts __tests__/daemon-start-flag-keys.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/ruflo2935/focused/vitest-report.json"
      - name: Summarize all evidence
        if: always()
        run: |
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/ruflo2935/hv_step.py" summarize --evidence "$RUNNER_TEMP/ruflo2935" --job "linux-full-${{ matrix.side }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruflo2935-hosted-linux-full-${{ matrix.side }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ruflo2935
          if-no-files-found: error
          retention-days: 7

  node20-build-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        side: [base, cand]
    defaults:
      run:
        shell: bash
    steps:

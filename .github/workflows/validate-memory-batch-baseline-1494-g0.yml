name: Measure memory batch baseline feasibility
on:
  push:
    branches: [validate-memory-batch-baseline-1494-g0]
permissions:
  contents: read
concurrency:
  group: ruflo1494-baseline-g0
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [root20, workspace22, cli22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ruvnet/ruflo
          ref: dc25dd9b522bf1f3761f0d061a0bd0deb1900ba1
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Execute one isolated baseline measurement
        env:
          APPROVED_DIAGNOSTIC_COMMIT: ${{ github.sha }}
          APPROVED_PLAN_SHA256: 82a5dc8d1847f1d50005be46e607c87639bc93a9f4184abefcbdafdedb5673f3
        run: python3 packet/validation/ruflo1494/hosted.py "${{ matrix.lane }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ruflo1494-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ruflo1494-${{ github.run_id }}-${{ matrix.lane }}/evidence
          if-no-files-found: warn
          retention-days: 7

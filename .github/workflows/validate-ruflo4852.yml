name: Validate native memory identity reads
on:
  push:
    branches: [validate-native-read-matches-4852-i3]
permissions:
  contents: read
concurrency:
  group: ruflo4852-i3-e1
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [root20, cli22, workspace22, smokes22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ruvnet/ruflo
          ref: 3fe9d70ba7d08ff12233003a9342037ab80af3ce
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Execute one owned baseline and candidate pair
        env:
          APPROVED_DIAGNOSTIC_COMMIT: ${{ github.sha }}
          APPROVED_PLAN_SHA256: '2672cc4b0cbec057deff4696044b456303691d52265e82577da2d1a7f95fef05'
          ATTEMPT_ID: ruflo4852-i3-e1
        run: python3 packet/validation/ruflo4852/hosted.py "${{ matrix.lane }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ruflo4852-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ruflo4852-${{ github.run_id }}-${{ matrix.lane }}/evidence
          if-no-files-found: warn
          retention-days: 7

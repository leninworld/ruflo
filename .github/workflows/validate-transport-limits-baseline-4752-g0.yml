name: Measure transport-limits baseline feasibility
on:
  push:
    branches: [validate-transport-limits-baseline-4752-g0]
permissions:
  contents: read
concurrency:
  group: ruflo4752-baseline-g0
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [root20, workspace22, gateway22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ruvnet/ruflo
          ref: 6b8095490e0cdb3389481b41d3a4c91d5dcbc991
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Execute one isolated baseline measurement
        env:
          APPROVED_DIAGNOSTIC_COMMIT: ${{ github.sha }}
          APPROVED_PLAN_SHA256: '2fa9e36354c98761cbaf88a7c11b43fce402a9e6a378711c2e148a2e7625ae7d'
        run: python3 packet/validation/ruflo4752/hosted.py "${{ matrix.lane }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ruflo4752-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ruflo4752-${{ github.run_id }}-${{ matrix.lane }}/evidence
          if-no-files-found: warn
          retention-days: 7
